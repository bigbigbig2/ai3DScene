[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-spatial-poc"
version = "0.1.0"
description = "Single-machine scene spatial PoC with FastAPI, SQLite, SAM, MoGe, and local spatial solving."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pillow>=10.4",
  "pyyaml>=6.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-cov>=5.0",
]
geometry = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "scipy>=1.14",
  "open3d>=0.18",
  "scikit-image>=0.24",
  "shapely>=2.0",
  "hdbscan>=0.8.33",
  "kornia>=0.7",
]

[project.scripts]
scene-spatial = "scene_spatial.cli.main:main"
scene-spatial-worker = "scene_spatial.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "model_smoke: tests that load real model environments and may require a GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]